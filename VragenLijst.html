<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <title>Voedingsvragenlijst</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="p-4">
    <div class="container">
        <h2 class="mb-4">Voedingsvragenlijst</h2>
        <form id="voedingForm">
            <div class="mb-3">
                <label for="groente" class="form-label">Hoe vaak eet je groente per week?</label>
                <input type="number" class="form-control" id="groente" min="0" max="21" required>
            </div>

            <div class="mb-3">
                <label for="fruit" class="form-label">Hoe vaak eet je fruit per week?</label>
                <input type="number" class="form-control" id="fruit" min="0" max="21" required>
            </div>

            <div class="mb-3">
                <label for="frisdrank" class="form-label">Hoe vaak drink je frisdrank per week?</label>
                <input type="number" class="form-control" id="frisdrank" min="0" max="21" required>
            </div>

            <div class="mb-3">
                <label for="gewicht" class="form-label">Hoe zwaar ben jij (kg)?</label>
                <input type="number" class="form-control" id="gewicht" min="0" max="250" required>
            </div>

            <div class="mb-3">
                <label for="alcohol" class="form-label">Hoeveel glazen alcohol drink jij per week?</label>
                <input type="number" class="form-control" id="alcohol" min="0" max="50" required>
            </div>

            <p class="mb-2">Hoe vaak beweeg jij per week?</p>
            <div class="container my-2">
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="beweging" id="beweging1" value="1" required>
                    <label class="form-check-label" for="beweging1">1-2 dagen</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="beweging" id="beweging2" value="3">
                    <label class="form-check-label" for="beweging2">3-4 dagen</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="beweging" id="beweging3" value="5">
                    <label class="form-check-label" for="beweging3">5-6 dagen</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="beweging" id="beweging4" value="7">
                    <label class="form-check-label" for="beweging4">Elke dag</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="beweging" id="beweging5" value="0">
                    <label class="form-check-label" for="beweging5">Niet</label>
                </div>
            </div>

            <button type="submit" class="btn btn-primary mt-3">Versturen!</button>
        </form>
    </div>

    <script>
        document.getElementById("voedingForm").addEventListener("submit", function (e) {
            e.preventDefault();

            const beweging = document.querySelector('input[name="beweging"]:checked')?.value;

            const data = {
                groente: parseInt(document.getElementById("groente").value),
                fruit: parseInt(document.getElementById("fruit").value),
                frisdrank: parseInt(document.getElementById("frisdrank").value),
                gewicht: parseInt(document.getElementById("gewicht").value),
                alcohol: parseInt(document.getElementById("alcohol").value),
                beweging: beweging ? parseInt(beweging) : 0
            };

            localStorage.setItem("voedingData", JSON.stringify(data));

            window.location.href = "resultaat.html";
        });
    </script>
</body>

</html>
