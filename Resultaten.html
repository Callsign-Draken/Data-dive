<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <title>Voedingsresultaten</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="p-4">
    <div class="container">
        <h2 class="mb-4">Jouw resultaten</h2>

        <table class="table table-bordered mb-5">
            <thead class="table-dark">
                <tr>
                    <th>Groente (per week)</th>
                    <th>Fruit (per week)</th>
                    <th>Frisdrank (per week)</th>
                    <th>Gewicht (kg)</th>
                    <th>Alcohol (per week)</th>
                    <th>Beweging (dagen/week)</th>
                </tr>
            </thead>
            <tbody id="tabelBody"></tbody>
        </table>

        <h3 class="mb-3">Vergelijking met volwassenen in Noord-Nederland</h3>
        <canvas id="voedingChart"></canvas>
    </div>

    <script>
        const data = JSON.parse(localStorage.getItem("voedingData"));

        if (!data) {
            document.getElementById("tabelBody").innerHTML =
                `<tr><td colspan="6" class="text-center">Geen gegevens gevonden</td></tr>`;
        } else {
            document.getElementById("tabelBody").innerHTML = `
                <tr>
                    <td>${data.groente}</td>
                    <td>${data.fruit}</td>
                    <td>${data.frisdrank}</td>
                    <td>${data.gewicht}</td>
                    <td>${data.alcohol}</td>
                    <td>${data.beweging}</td>
                </tr>
            `;

            const noordGemiddelde = {
                groente: 10,
                fruit: 7,
                frisdrank: 5,
                gewicht: 80,
                alcohol: 3,
                beweging: 3
            };

            const labels = ["Groente", "Fruit", "Frisdrank", "Gewicht", "Alcohol", "Beweging"];

            const chartData = {
                labels: labels,
                datasets: [
                    {
                        label: "Jouw antwoorden",
                        data: [
                            data.groente,
                            data.fruit,
                            data.frisdrank,
                            data.gewicht,
                            data.alcohol,
                            data.beweging
                        ],
                        borderColor: "blue",
                        backgroundColor: "blue",
                        tension: 0.3
                    },
                    {
                        label: "Gemiddelde volwassenen Noord-Nederland",
                        data: [
                            noordGemiddelde.groente,
                            noordGemiddelde.fruit,
                            noordGemiddelde.frisdrank,
                            noordGemiddelde.gewicht,
                            noordGemiddelde.alcohol,
                            noordGemiddelde.beweging
                        ],
                        borderColor: "orange",
                        backgroundColor: "orange",
                        borderDash: [5, 5],
                        tension: 0.3
                    }
                ]
            };

            new Chart(document.getElementById("voedingChart"), {
                type: "line",
                data: chartData,
                options: {
                    responsive: true,
                    plugins: {
                        legend: { position: "top" },
                        title: { display: true, text: "Jouw antwoorden vs. Gemiddelde volwassenen Noord-Nederland" }
                    }
                }
            });
        }
    </script>
</body>

</html>
